name: Verify project management links

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  project-management-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check website changes have management links
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python -B scripts/project_change_tracker.py --check --range "$BASE_SHA..$HEAD_SHA" --no-working-tree
