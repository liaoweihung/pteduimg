name: Update dashboard and publish Pages
on:
  push:
    branches: [main]
    # Site inputs and machine-readable management data; prose-only edits can use manual dispatch.
    paths:
      - '*.html'
      - '*.json'
      - 'cards/**'
      - 'img/**'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'topics/**'
      - 'web/**'
      - 'calc/**'
      - 'templates/**'
      - 'build.py'
      - 'scripts/build_dashboard.py'
      - 'scripts/check_project_management.py'
      - 'scripts/site_footer.py'
      - 'scripts/site_header.py'
      - 'scripts/acne_pilot.py'
      - 'docs/project-management/*.csv'
      - 'docs/project-management/content-topics.json'
      - 'docs/project-management/audit-register.json'
      - '.github/workflows/dashboard-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: dashboard-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate dashboard from latest source and save only its outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -B scripts/build_dashboard.py
            git add -- dashboard/index.html dashboard/status.json
            if git diff --cached --quiet; then break; fi
            git commit -m '自動化: Update website dashboard snapshot'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Request branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
